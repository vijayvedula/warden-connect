<title>The Connection Nobody Approved</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap">

<style>
  :root {
    /* Inherited from docs/contract-and-enforcement.html — the same product, the same voice.
       Single-theme on purpose: this is a film frame, and a film frame has one ground. */
    --ground:  #070A11;
    --film:    #0B0F17;
    --panel:   #0E131C;
    --rule:    #28323F;
    --ink:     #E9EEF6;
    --muted:   #8695AB;
    --surface: #58C6E6;
    --scope:   #F0BE52;
    --policy:  #7FD39B;
    --refuse:  #E86F6F;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vw, 40px);
    box-sizing: border-box;
  }

  .reel { width: min(1180px, 100%); display: flex; flex-direction: column; gap: 14px; }

  .frame {
    position: relative;
    background: var(--film);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* Transport. Deliberately spare — it should read as a projector, not a web player. */
  .transport { display: flex; align-items: center; gap: 14px; }

  button.play {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink);
    width: 42px; height: 42px;
    border-radius: 2px;
    cursor: pointer;
    font: inherit; font-size: 14px;
    display: grid; place-items: center;
    flex: none;
    transition: border-color .15s, color .15s;
  }
  button.play:hover { border-color: var(--surface); color: var(--surface); }
  button.play:focus-visible { outline: 2px solid var(--surface); outline-offset: 2px; }

  .track {
    position: relative; flex: 1; height: 42px; cursor: pointer;
    display: flex; align-items: center;
  }
  .track:focus-visible { outline: 2px solid var(--surface); outline-offset: 2px; }
  .track .bed { position: absolute; left: 0; right: 0; height: 1px; background: var(--rule); }
  .track .fill { position: absolute; left: 0; height: 1px; background: var(--surface); }
  .track .chapters { position: absolute; left: 0; right: 0; height: 42px; }
  .track .chapters i {
    position: absolute; top: 15px; width: 1px; height: 12px; background: var(--rule);
  }
  .track .chapters i.act { top: 11px; height: 20px; background: var(--muted); }
  .track .head {
    position: absolute; width: 2px; height: 18px; background: var(--ink); transform: translateX(-1px);
  }

  .clock { color: var(--muted); font-size: 12px; letter-spacing: .06em; flex: none;
           font-variant-numeric: tabular-nums; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 20px;
    color: var(--muted); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase;
  }
  .legend b { font-weight: 400; color: var(--ink); }
  .legend span::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 7px; vertical-align: 1px; background: currentColor;
  }
  .s-surface { color: var(--surface); }
  .s-scope   { color: var(--scope); }
  .s-policy  { color: var(--policy); }

  @media (prefers-reduced-motion: reduce) {
    button.play { border-color: var(--surface); }
  }
</style>

<div class="reel">
  <div class="frame">
    <canvas id="stage" role="img"
      aria-label="A two-minute-twenty-three animated walkthrough in two acts, twelve slides, each holding its finished frame for five seconds before the cut. The problem: an agent called recon-bot holds a token scoped payments colon star and is wired to an MCP server, payments-mcp, which unfolds five tools — get_balance, list_transactions, transfer_funds, issue_refund, close_account — every one marked reachable, five of five. The token admits the server and the server admits every tool: reachable is not approved, and nothing in the picture can tell them apart. That pair multiplies into an estate which freezes while three unanswerable questions appear, and the problem splits into two planes: may this connection exist, owned by warden-connect, and may this call proceed, owned by warden. Act one is contract creation as GitOps, across three slides. First, two lanes that never touch: the provider merges warden slash offer dot toml under its own approvers, the consumer merges warden slash needs dot toml under different approvers, neither party reviews the other pull request, and they join only at the control plane, which confirms both merges with the source host rather than the pipelines. Four source hosts are supported — GitHub, GitLab, Azure Repos and Bitbucket — each asked through an operator supplied shim, so a fifth host is a script rather than a release. Second, the disposition — one need, three outcomes: pre-granted goes straight to a minted contract with no person involved, because the provider approved a class once in a reviewed commit; gated routes to the callee owner and nothing is minted while the whole need waits on one item; refused stops, because no term covers this consumer and approval cannot help. Third, where the contract then lives: git holds a receipt and never the signed artifact, the control plane holds the artifact and the register, and every enforcement point holds a verified copy in memory that refreshes and expires — which is why a revocation has somewhere to arrive. Act two is enforcement. First the algebra: effective equals surface intersect scope intersect policy, with surface bracketed as warden-connect at issuance and scope and policy bracketed as warden at authentication and per call. Then the three enforcement points, side by side, sharing one decision core. Envoy runs wc-extproc as an ext_proc gRPC filter one hop away, with request_body_mode set to BUFFERED because the tool name is in the JSON-RPC body rather than a header, and failure_mode_allow set to false so an unreachable verifier refuses instead of failing open; identity comes from an mTLS certificate or XFCC. Kong loads libwc_kong.so into the nginx worker over LuaJIT FFI and decides in the Lua access phase at priority 1000 — no socket, no serialisation, one handle per worker; identity comes from a client certificate or XFCC. The inline mediator, connect-mediate, spawns the real server over stdio and sits in the path rather than beside it; its identity is configured rather than proven, and it writes no decision trail. Every verdict comes from the same wc-gateway core with the same gates and the same WC codes. Then the refusal itself, run three times in the same order and the same colours as those columns: one contract feeds all three placements, and in each of them get_balance passes through to payments-mcp while transfer_funds is stopped at the enforcement point and refused WC-4002 — refused at the hop by Envoy, inside the worker by Kong, and in the agent own path by the mediator. Three placements, one core, the same code. Then one revocation reaches every enforcement point while every decision is written to a hash-chained trail. The last diagram lays the whole system out at once, in three columns. Git holds the desired state — offer, needs and the contract receipts — reviewed under a declared approval block, across four source hosts. The control plane holds the capabilities: admission, policy, issuance, custody, revocation, assurance, broker and federation, reached over HTTP slash v1 under four roles with dual control, and it is the only thing that mints a contract. Enforcement holds the three points — Envoy, Kong and the inline mediator — each running the same gates over a verified copy bounded by max_stale, with no network call on the hot path. Between them move artifacts rather than calls: a confirmed merge and a receipt on one side, a contract set, revocations and an acknowledgement on the other. Underneath, evidence leaves as a decision trail at the edge and a lifecycle chain in the plane, and warden receives the ceiling and decides every call. The film closes on the wordmark, the line "the connection control plane for AI agents", and the three enforcement points."></canvas>
  </div>

  <div class="transport">
    <button class="play" id="play" aria-label="Play">▶</button>
    <div class="track" id="track" role="slider" tabindex="0"
         aria-label="Timeline" aria-valuemin="0" aria-valuemax="143" aria-valuenow="0">
      <div class="bed"></div><div class="fill" id="fill"></div>
      <div class="chapters" id="chapters"></div><div class="head" id="head"></div>
    </div>
    <div class="clock" id="clock">0:00 / 2:23</div>
  </div>

  <div class="legend">
    <span class="s-surface"><b>surface</b> warden-connect · at issuance</span>
    <span class="s-scope"><b>scope</b> warden · at authentication</span>
    <span class="s-policy"><b>policy</b> warden · per call</span>
  </div>
</div>

<script>
(() => {
  "use strict";

  const W = 1600, H = 900, DUR = 143;
  const SERIF = '"Newsreader", Georgia, "Times New Roman", serif';
  const MONO  = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace';

  const C = {
    film: "#0B0F17", panel: "#0E131C", rule: "#28323F",
    ink: "#E9EEF6", muted: "#8695AB", dim: "#5A6879",
    surface: "#58C6E6", scope: "#F0BE52", policy: "#7FD39B", refuse: "#E86F6F",
  };

  const cv = document.getElementById("stage");
  const ctx = cv.getContext("2d");

  // ---- maths -------------------------------------------------------------
  const cl  = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const sm  = (a, b, v) => { const t = cl((v - a) / (b - a || 1e-6), 0, 1); return t * t * (3 - 2 * t); };
  const easeOut = t => 1 - Math.pow(1 - cl(t, 0, 1), 3);

  /** Fade in, hold, fade out — the only opacity envelope any of this needs. */
  const env = (t, a, b, f = 0.45) => Math.min(sm(a, a + f, t), 1 - sm(b - f, b, t));

  /** Deterministic, so scrubbing backwards lands on the same frame it left. */
  function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

  // ---- text --------------------------------------------------------------
  const canSpace = "letterSpacing" in ctx;
  function txt(s, x, y, o = {}) {
    const { size = 28, font = MONO, color = C.ink, align = "left", alpha = 1,
            weight = "", spacing = 0, baseline = "alphabetic", italic = false } = o;
    if (alpha <= 0.001) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    ctx.font = `${italic ? "italic " : ""}${weight ? weight + " " : ""}${size}px ${font}`;
    if (canSpace && spacing) ctx.letterSpacing = `${spacing}px`;
    ctx.fillText(s, x, y);
    if (canSpace && spacing) ctx.letterSpacing = "0px";
    ctx.restore();
  }

  // The slide's statements, placed so they ACCUMULATE instead of replacing one another.
  //
  // A single band that cycles loses the argument: by the time a slide has finished building,
  // only its last sentence is still on screen and the reader has nothing left to assemble.
  // So the first statement goes to the top and stays there, later ones stack at the bottom,
  // and through the five-second hold the whole argument is readable at once, beside the
  // finished diagram. Serif for the claim a person makes, mono for the machine's own words.

  /** The opening statement. Sits above the diagram for the whole slide. */
  function capTop(claim, note, alpha) {
    if (alpha <= 0.001) return;
    txt(claim, W / 2, 100, { size: 28, font: SERIF, align: "center", alpha, color: C.ink });
    if (note) txt(note, W / 2, 126, { size: 14, align: "center", alpha: alpha * 0.7,
                                      color: C.muted, spacing: 1.2 });
  }

  /** Later statements, stacked below the diagram in the order they were made. */
  const STACK_Y = [762, 824];
  function capStack(i, claim, note, alpha) {
    if (alpha <= 0.001) return;
    const y = STACK_Y[i];
    txt(claim, W / 2, y, { size: 28, font: SERIF, align: "center", alpha, color: C.ink });
    if (note) txt(note, W / 2, y + 26, { size: 14, align: "center", alpha: alpha * 0.7,
                                         color: C.muted, spacing: 1.2 });
  }

  /** A slide whose whole point is one sentence keeps the single band. */
  function caption(claim, note, alpha) {
    if (alpha <= 0.001) return;
    if (claim) txt(claim, W / 2, 792, { size: 38, font: SERIF, align: "center", alpha, color: C.ink });
    if (note)  txt(note,  W / 2, 836, { size: 16, align: "center", alpha: alpha * 0.72,
                                        color: C.muted, spacing: 1.5 });
  }

  function line(x1, y1, x2, y2, color, width = 1, alpha = 1, dash = null) {
    if (alpha <= 0.001) return;
    ctx.save();
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }

  function dot(x, y, r, color, alpha = 1) {
    if (alpha <= 0.001) return;
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  function box(x, y, w, h, { stroke = C.rule, fill = null, alpha = 1, width = 1, r = 2 } = {}) {
    if (alpha <= 0.001) return;
    ctx.save(); ctx.globalAlpha = alpha; ctx.lineWidth = width;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - w / 2, y - h / 2, w, h, r);
    else ctx.rect(x - w / 2, y - h / 2, w, h);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
    ctx.restore();
  }

  // ---- the estate, laid out once ----------------------------------------
  const SYSTEMS = ["payments", "ledger", "hr-records", "crm", "object-store"];
  const sysY = i => 210 + i * 122;
  const SYS_X = 1215;

  const AGENTS = (() => {
    const r = rng(20260829), out = [];
    for (let i = 0; i < 18; i++) {
      out.push({
        x: 300 + r() * 120,
        y: 175 + (i / 17) * 560 + (r() - 0.5) * 34,
        sys: Math.floor(r() * SYSTEMS.length),
        born: i * 0.27,
      });
    }
    return out;
  })();

  /** The tangle. `grey` desaturates it in place when the film stops to ask its question. */
  function drawEstate(t, alpha, grey) {
    if (alpha <= 0.001) return;
    const linkC = grey > 0.5 ? C.rule : C.surface;

    for (const s of SYSTEMS.keys()) {
      const y = sysY(s);
      box(SYS_X, y, 210, 46, { stroke: grey > 0.5 ? C.rule : "#3C4A5C", fill: C.panel, alpha });
      txt(SYSTEMS[s], SYS_X, y + 5, { size: 15, align: "center",
                                      alpha: alpha * (grey > 0.5 ? 0.8 : 0.9),
                                      color: grey > 0.5 ? C.muted : C.ink, spacing: 1.2 });
    }

    for (const a of AGENTS) {
      const age = t - a.born;
      if (age < 0) continue;
      const grow = easeOut(age / 0.85);
      const tx = SYS_X - 105, ty = sysY(a.sys);
      const ex = lerp(a.x, tx, grow), ey = lerp(a.y, ty, grow);

      ctx.save();
      ctx.globalAlpha = alpha * (grey > 0.5 ? 0.5 : 0.5);
      ctx.strokeStyle = linkC; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo((a.x + tx) / 2, (a.y + ty) / 2 - 55, ex, ey);
      ctx.stroke();
      ctx.restore();

      // A packet in flight, so the tangle reads as live traffic rather than a diagram.
      if (grow >= 1 && grey < 0.5) {
        const p = ((t * 0.42 + a.born) % 1);
        const mx = (a.x + tx) / 2, my = (a.y + ty) / 2 - 55;
        const px = (1 - p) * (1 - p) * a.x + 2 * (1 - p) * p * mx + p * p * tx;
        const py = (1 - p) * (1 - p) * a.y + 2 * (1 - p) * p * my + p * p * ty;
        dot(px, py, 2.4, C.surface, alpha * 0.85);
      }

      const ac = grey > 0.5 ? C.dim : C.ink;
      dot(a.x, a.y, 4.5, ac, alpha * easeOut(age / 0.35));
    }
  }

  // ---- scenes ------------------------------------------------------------
  // Each is a pure function of its own local time. Nothing accumulates, so the
  // scrubber is free and frame N looks the same whichever direction you reached it from.

  // The tool surface of one real MCP server. `transfer_funds` is the one that should worry a
  // reader, and the point of the scene is that nothing in the picture treats it differently.
  const TOOLS = ["get_balance", "list_transactions", "transfer_funds", "issue_refund",
                 "close_account"];
  const ALARM = 2;
  const SRV = { x: 1120, y: 380, w: 420, h: 364 };

  function s1_reach(t) {                // 0 → 6.5   what actually decides an agent's reach
    // One pair, drawn as an engineer would draw it. The estate comes next; the sprawl is not
    // the problem and showing it first said it was. The problem is that the reach of THIS
    // agent on THIS server was chosen by nobody — a token names a service and stops.
    const aA = env(t, 0.15, 99, 0.4);
    dot(280, 380, 9, C.ink, aA);
    txt("recon-bot", 280, 416, { size: 15, align: "center", color: C.ink, alpha: aA, spacing: 1.2 });
    txt("an agent", 280, 440, { size: 13, align: "center", color: C.muted, alpha: aA * 0.8 });

    const aT = env(t, 0.5, 99, 0.4);
    box(280, 500, 310, 52, { stroke: C.scope, fill: C.panel, alpha: aT });
    txt("token    scope:  payments:*", 280, 505,
        { size: 14, align: "center", color: C.scope, alpha: aT });

    // The wire. It is drawn, not implied — this connection is made at run time by the agent's
    // own configuration, and that is the whole trouble.
    const wire = sm(0.9, 1.6, t);
    if (wire > 0) {
      line(300, 380, lerp(300, SRV.x - SRV.w / 2 - 10, wire), 380, C.rule, 1, 0.8);
      if (wire >= 1) {
        const k = (t * 0.55) % 1;
        dot(lerp(305, SRV.x - SRV.w / 2 - 14, k), 380, 3, C.surface, 0.85);
      }
    }

    const aS = env(t, 1.35, 99, 0.4);
    if (aS > 0.001) {
      box(SRV.x, SRV.y, SRV.w, SRV.h, { stroke: C.rule, fill: C.panel, alpha: aS, r: 3 });
      txt("payments-mcp", SRV.x, 246, { size: 19, align: "center", color: C.ink, alpha: aS });
      txt("MCP server  ·  its tool surface", SRV.x, 272,
          { size: 13, align: "center", color: C.muted, alpha: aS * 0.8, spacing: 0.8 });
      line(SRV.x - 180, 292, SRV.x + 180, 292, C.rule, 1, aS * 0.6);

      TOOLS.forEach((tool, i) => {
        const a = env(t, 1.9 + i * 0.2, 99, 0.3);
        if (a <= 0.001) return;
        const y = 330 + i * 44;
        const lit = cl((t - (3.2 + i * 0.18)) / 0.25, 0, 1);
        const c = i === ALARM && lit > 0 ? C.refuse : C.ink;
        txt(tool, SRV.x - 174, y, { size: 15, color: c, alpha: a });
        // Reachable. Not permitted, not requested, not reviewed — reachable.
        txt("reachable", SRV.x + 174, y, { size: 13, align: "right",
                                           color: i === ALARM ? C.refuse : C.scope, alpha: a * lit });
      });
    }

    // Five of five, which is the number nobody chose.
    const aB = env(t, 4.3, 99, 0.4);
    if (aB > 0.001) {
      const bx = SRV.x + SRV.w / 2 + 26;
      line(bx, 316, bx, 520, C.scope, 1, aB * 0.8);
      line(bx, 316, bx - 8, 316, C.scope, 1, aB * 0.8);
      line(bx, 520, bx - 8, 520, C.scope, 1, aB * 0.8);
      txt("5 of 5", bx + 14, 410, { size: 16, color: C.scope, alpha: aB, spacing: 1 });
      txt("reachable", bx + 14, 434, { size: 13, color: C.muted, alpha: aB * 0.85 });
    }

    txt("The token lets the agent reach the server, and the server offers every tool it has.",
        800, 606,
        { size: 15, align: "center", color: C.muted, alpha: env(t, 4.6, 99, 0.4) * 0.9,
          spacing: 0.6 });

    capTop("The token only names a service.",
            "It says nothing about which tools the agent may use.", env(t, 0.5, 99, 0.4));
    capStack(0, "The server offers every tool that it has.",
            "All five of them are available to anyone the token lets through.",
            env(t, 2.7, 99, 0.4));
    capStack(1, "Being able to reach it is not the same as approval.",
            "Nobody ever decided that this agent may call transfer_funds.",
            env(t, 4.9, 99, 0.4));
  }

  function s2_estate(t) {               // 6.5 → 12   now multiply it, then stop
    // The sprawl earns its place here rather than opening on it: it is the same defect N
    // times, and only means something once the reader knows what the one pair was missing.
    const built = Math.min(t * 4.6, 5.5);
    const grey = sm(1.3, 1.9, t);
    drawEstate(built, 1, grey);

    // Thirty-eight per cent, not seventy-two. At seventy-two the estate was a rumour: the
    // questions are ABOUT the dots on the left and the servers on the right, and asking them
    // over an empty frame throws away the only thing that makes them land.
    const veil = grey * 0.38;
    ctx.save(); ctx.globalAlpha = veil; ctx.fillStyle = C.film;
    ctx.fillRect(0, 0, W, H); ctx.restore();

    // The questions sit in the clear band BETWEEN the two — agents end at x≈425, the servers
    // begin at x=1110 — rather than across the whole width. The third question used to run
    // through the `hr-records` box, which is what a reader saw first.
    const QX = 765;
    txt("every agent  ·  every server  ·  every tool", QX, 150,
        { size: 17, align: "center", color: C.muted, alpha: env(t, 0.5, 2.0, 0.35), spacing: 2 });

    const qs = ["which agents can reach payments ?",
                "who approved that connection ?",
                "how do you revoke it, everywhere, now ?"];
    qs.forEach((q, i) => {
      const a = env(t, 1.75 + i * 0.55, 10.2, 0.3);
      txt(q, QX, 330 + i * 62, { size: 27, align: "center", alpha: a, color: C.ink, spacing: 0.4 });
      line(QX - 320, 348 + i * 62, QX + 320, 348 + i * 62, C.rule, 1, a * 0.35);
    });
    caption("Nothing in the estate can answer these questions.",
            "There is no record of who approved any of these connections.",
            env(t, 3.3, 99, 0.4));
  }

  function s3_split(t) {                // 12 → 17.5   two questions, two products
    const p = sm(0, 1.1, t);
    drawEstate(5.5, (1 - p) * 0.5, 1);

    const yA = 300, yB = 585;
    line(160, 442, W - 160, 442, C.rule, 1, p * 0.55, [5, 7]);

    // Each question, then who answers it. The owner used to be a word inside the sub-line,
    // which is where a reader's eye goes last — and "which product does what" is the first
    // thing an architect wants from a family of four.
    // Measured, not placed by eye. The two questions are different lengths and the display face
    // may be Newsreader or the Georgia fallback, so a hardcoded arrow either collides with the
    // longer question or leaves a gap after the shorter one. Both arrows align past whichever
    // question is wider, whatever font actually loaded.
    const QA = "May this connection exist ?", QB = "May this call proceed ?";
    ctx.save();
    ctx.font = `44px ${SERIF}`;
    const qw = Math.max(ctx.measureText(QA).width, ctx.measureText(QB).width);
    ctx.restore();
    const ax = 200 + qw + 58, px = ax + 112;

    const owner = (y, c, a) => {
      line(ax, y, ax + 78, y, c, 1.5, a * 0.85);
      line(ax + 68, y - 6, ax + 78, y, c, 1.5, a * 0.85);
      line(ax + 68, y + 6, ax + 78, y, c, 1.5, a * 0.85);
    };

    // The slow plane: signed, human, and the one nobody owned.
    const aA = env(t, 0.35, 10.5, 0.4);
    line(200, yA + 62, W - 200, yA + 62, C.rule, 1, aA * 0.5);
    txt(QA, 200, yA, { size: 44, font: SERIF, alpha: aA, color: C.ink });
    owner(yA - 14, C.surface, env(t, 1.5, 10.5, 0.4));

  /**
   * The formula, drawn term by term so each carries its own colour — and so the
   * bracket beneath can point at the exact terms each product owns.
   * Returns the x-span of the named terms.
   */
  function formula(cx, y, alpha) {
    const parts = [
      { s: "effective", c: C.ink }, { s: "  =  ", c: C.dim },
      { s: "surface", c: C.surface, key: "surface" },
      { s: "  ∩  ", c: C.dim },
      { s: "scope", c: C.scope, key: "scope" },
      { s: "  ∩  ", c: C.dim },
      { s: "policy", c: C.policy, key: "policy" },
    ];
    ctx.save();
    ctx.font = `27px ${MONO}`;
    const w = parts.map(p => ctx.measureText(p.s).width);
    ctx.restore();

    const total = w.reduce((a, b) => a + b, 0);
    let x = cx - total / 2;
    const span = {};
    parts.forEach((p, i) => {
      if (p.key) span[p.key] = [x, x + w[i]];
      txt(p.s, x, y, { size: 27, color: p.c, alpha, align: "left" });
      x += w[i];
    });
    return span;
  }

  /** Who owns which terms — the product boundary, drawn on the algebra itself. */
  function owner(x1, x2, y, color, product, when, alpha) {
    if (alpha <= 0.001) return;
    line(x1, y, x2, y, color, 1, alpha * 0.75);
    line(x1, y, x1, y - 7, color, 1, alpha * 0.75);
    line(x2, y, x2, y - 7, color, 1, alpha * 0.75);
    const mid = (x1 + x2) / 2;
    txt(product, mid, y + 26, { size: 16, align: "center", color, alpha, spacing: 1.1 });
    txt(when, mid, y + 48, { size: 13, align: "center", color: C.muted, alpha: alpha * 0.8 });
  }

  function s5_algebra(t) {              // 32.5 → 40.5   the ceiling, and whose it is
    const p = sm(0.2, 2.2, t);
    const cx = 800, R = 140;
    const rings = [
      // Twenty pixels lower than they were. The rings' upper edge used to sit at y=120 and the
      // slide's opening statement now runs along y=117–129, so the sentence was drawing through
      // the top of both of them.
      { x: lerp(420, 706, p),  y: lerp(250, 280, p), c: C.surface, label: "surface", side: "L" },
      { x: lerp(1180, 894, p), y: lerp(250, 280, p), c: C.scope,   label: "scope",   side: "R" },
      { x: cx,                 y: lerp(660, 437, p), c: C.policy,  label: "policy",  side: "B" },
    ];

    for (const r of rings) {
      ctx.save();
      ctx.globalAlpha = 0.09; ctx.fillStyle = r.c;
      ctx.beginPath(); ctx.arc(r.x, r.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.85; ctx.strokeStyle = r.c; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, R, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // The intersection, by actual clipping — so the shape on screen is the algebra,
    // not an artist's impression of it.
    const glow = env(t, 2.2, 99, 0.6);
    if (glow > 0.001) {
      ctx.save();
      for (const r of rings) { ctx.beginPath(); ctx.arc(r.x, r.y, R, 0, Math.PI * 2); ctx.clip(); }
      ctx.globalAlpha = glow * (0.55 + 0.12 * Math.sin(t * 2.4));
      ctx.fillStyle = C.policy;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    rings.forEach(r => {
      const lx = r.side === "B" ? r.x : r.x + (r.side === "L" ? -R - 14 : R + 14);
      // Beside the ring at its centre, not at its top edge — the top belongs to the
      // slide's opening statement now.
      const ly = r.side === "B" ? r.y + R + 29 : r.y + 5;
      txt(r.label, lx, ly, {
        size: 17, alpha: p * 0.95, color: r.c, spacing: 2.4,
        align: r.side === "B" ? "center" : (r.side === "L" ? "right" : "left"),
      });
    });

    // The algebra, then the product boundary drawn straight onto its terms.
    const fa = env(t, 2.6, 99, 0.5);
    const span = formula(cx, 650, fa);
    const oa = env(t, 3.6, 99, 0.5);
    owner(span.surface[0], span.surface[1], 674, C.surface, "warden-connect", "at issuance", oa);
    owner(span.scope[0], span.policy[1], 674, C.policy, "warden", "at authentication · per call", oa);

    capTop("A contract sets a limit. It never grants access.",
            "It can only reduce what an agent is already allowed to do.",
            env(t, 4.5, 99, 0.4));
    caption("warden-connect sets the limit. warden works within it.",
            "Neither product is a complete control on its own.", env(t, 6.4, 99, 0.4));
  }

    const ac = env(t, 0.2, 99, 0.4);
    box(PEP_X, 152, 150, 34, { stroke: C.surface, fill: C.film, alpha: ac, r: 2 });
    txt("contract", PEP_X, 157, { size: 14, align: "center", color: C.surface,
                                  alpha: ac, spacing: 1.6 });
    line(PEP_X, 169, PEP_X, LANE_Y[2] - 24, C.surface, 1, ac * 0.35, [4, 7]);

    RUNS.forEach((r, i) => {
      const T = 0.6 + i * 2.5;
      const a = env(t, T, 99, 0.4);
      if (a <= 0.001) return;
      const y = LANE_Y[i];

      txt(r.tag, 64, y + 5, { size: 13, color: r.c, alpha: a, spacing: 2.4 });

      dot(CALLER_X, y, 7, C.ink, a * 0.95);
      line(CALLER_X + 12, y, REFUSE_AT, y, C.rule, 1, a * 0.7);
      line(PEP_X + 125, y, CALLEE_X - 95, y, C.rule, 1, a * 0.7);

      box(PEP_X, y, 250, 48, { stroke: r.c, fill: C.panel, alpha: a, width: 1.4 });
      txt(r.pep, PEP_X, y + 5, { size: 14, align: "center", color: r.c, alpha: a });
      txt(r.note, PEP_X, y + 40, { size: 12.5, align: "center", color: C.muted, alpha: a * 0.8 });

      box(CALLEE_X, y, 190, 48, { stroke: "#3C4A5C", fill: C.panel, alpha: a });
      txt("payments-mcp", CALLEE_X, y + 5, { size: 13, align: "center", color: C.ink, alpha: a });

      // The contracted call goes all the way through.
      const g = (t - (T + 0.3)) / 1.2;
      if (g > 0 && g < 1.3) {
        const k = cl(g, 0, 1), gx = lerp(CALLER_X, CALLEE_X, k);
        const fade = Math.min(1, (1.3 - g) * 3);
        dot(gx, y, 5.5, C.policy, fade);
        const clearOfBoxes = Math.min(sm(126, 218, Math.abs(gx - PEP_X)),
                                      sm(96, 186, Math.abs(gx - CALLEE_X)));
        txt("get_balance", gx, y - 26, { size: 13, align: "center", color: C.policy,
                                         alpha: fade * clearOfBoxes * 0.9 });
      }

      // The uncontracted one stops at the enforcement point. It never reaches the callee, in
      // any of the three — which is the only thing this slide is claiming.
      const b = (t - (T + 1.5)) / 0.9;
      if (b > 0) {
        const k = cl(b, 0, 1), bx = lerp(CALLER_X, REFUSE_AT, k);
        const ba = b < 2.2 ? 1 : Math.max(0, 1 - (b - 2.2) * 1.6);
        dot(bx, y, 5.5, C.refuse, ba);
        txt("transfer_funds", bx - 14, y - 26, { size: 13, align: "right",
                                                 color: C.refuse, alpha: ba * 0.9 });
      }
      const badge = env(t, T + 2.2, 99, 0.3);
      if (badge > 0.001) {
        line(REFUSE_AT, y - 30, REFUSE_AT, y + 30, C.refuse, 2, badge * 0.9);
        txt("WC-4002", REFUSE_AT, y - 42, { size: 13, align: "center",
                                            color: C.refuse, alpha: badge, spacing: 0.8 });
      }
    });

    capTop("Envoy blocks the call at the network hop.", null, env(t, 0.9, 99, 0.4));
    capStack(0, "Kong blocks the call inside the nginx worker.", null, env(t, 3.4, 99, 0.4));
    capStack(1, "The mediator blocks it in the agent's own process.",
            "The result is the same in all three, because the code is the same.", env(t, 5.9, 99, 0.4));
  }

  function s7_revoke(t) {               // 47 → 53.5   contained, and on the record
    const cx = 800, cy = 166;
    const posts = [400, 800, 1200], py = 322;

    box(cx, cy, 260, 46, { stroke: C.rule, fill: C.panel });
    txt("control plane", cx, cy + 5, { size: 15, align: "center", color: C.muted, spacing: 1.8 });

    const wave = (t - 0.45) * 620;
    posts.forEach(x => {
      const d = Math.hypot(x - cx, py - cy);
      const hit = wave > d;
      const flash = hit ? Math.max(0, 1 - (wave - d) / 300) : 0;
      line(cx, cy + 23, x, py - 26, hit ? C.refuse : C.rule, 1, hit ? 0.35 + flash * 0.5 : 0.3);
      box(x, py, 200, 54, { stroke: hit ? C.refuse : C.rule, fill: C.panel, width: hit ? 1.6 : 1 });
      txt("enforcement", x, py + 4, { size: 14, align: "center", spacing: 1.5,
                                      color: hit ? C.refuse : C.muted });
      line(x, py + 27, x, py + 74, hit ? C.refuse : C.surface, 1, hit ? 0.25 : 0.6,
           hit ? [4, 6] : null);
      dot(x, py + 82, 5, hit ? C.rule : C.surface, 0.9);
    });
    if (wave > 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 0.5 - wave / 1400);
      ctx.strokeStyle = C.refuse; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, wave, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      txt("revoke", cx, cy - 40, { size: 17, align: "center", color: C.refuse,
                                   alpha: Math.max(0, 1 - (t - 0.45) / 3), spacing: 2.6 });
    }

    // Every decision, linked to the one before it.
    const bl = 8, bw = 120, gap = 26, total = bl * bw + (bl - 1) * gap;
    const x0 = (W - total) / 2 + bw / 2, by = 560;
    for (let i = 0; i < bl; i++) {
      const a = env(t, 1.4 + i * 0.18, 11.5, 0.26);
      if (a <= 0.001) continue;
      const x = x0 + i * (bw + gap);
      box(x, by, bw, 50, { stroke: C.rule, fill: C.panel, alpha: a });
      txt("WC-" + ["0000", "4002", "0000", "0000", "3108", "0000", "4001", "0000"][i],
          x, by + 5, { size: 14, align: "center", color: i % 2 ? C.muted : C.dim, alpha: a });
      if (i > 0) line(x - bw / 2 - gap, by, x - bw / 2, by, C.surface, 1, a * 0.7);
    }
    txt("hash-chained  ·  an edit anywhere invalidates every row after it", W / 2, 636,
        { size: 15, align: "center", color: C.muted, alpha: env(t, 2.8, 11.5, 0.32), spacing: 1.3 });

    caption("One revocation reaches every enforcement point.",
            "Every decision is written to a record that cannot be edited unnoticed.",
            env(t, 3.9, 99, 0.4));
  }

  // The whole thing at once. Three columns because the product is three places — desired state
  // in git, decisions in the plane, enforcement at the edge — and every capability belongs to
  // exactly one of them. The two boxes underneath are what leaves: a record, and a ceiling
  // handed to warden.
  const ARCH = [
    { x: 265,  c: C.scope,   name: "GIT",           sub: "desired state, reviewed",
      foot: "GitHub · GitLab · Azure Repos · Bitbucket",
      lines: ["warden/offer.toml", "warden/needs.toml", "warden/contracts/<cid>.toml", null,
              "[approval]   ·   min = 2", "the merge is the approval", "four source hosts, by shim"] },
    { x: 1335, c: C.policy,  name: "ENFORCEMENT",   sub: "wc-gateway  ·  one core",
      foot: "no network call on the hot path",
      lines: ["Envoy  ·  wc-extproc", "Kong  ·  libwc_kong.so", "inline  ·  connect-mediate",
              null, "identity · contract · surface · pin", "a verified copy · max_stale",
              "the decision trail"] },
  ];
  const CAPS = [["admission", "policy"], ["issuance", "custody"],
                ["revocation", "assurance"], ["broker", "federation"]];

  function s7b_architecture(t) {        // everything, laid out once
    txt("warden-connect   ·   logical architecture", 800, 158,
        { size: 18, align: "center", color: C.muted, alpha: env(t, 0.2, 99, 0.4), spacing: 2.4 });

    const head = (col, a) => {
      txt(col.name, col.x, 204, { size: 17, align: "center", color: col.c, alpha: a, spacing: 2.6 });
      txt(col.sub, col.x, 230, { size: 12.5, align: "center", color: C.muted, alpha: a * 0.8 });
      box(col.x, 400, 400, 300, { stroke: col.c, fill: C.panel, alpha: a, width: 1.3, r: 3 });
      txt(col.foot, col.x, 578, { size: 12, align: "center", color: C.muted, alpha: a * 0.8 });
    };

    // 1 · git, and 3 · the edge
    ARCH.forEach((col, i) => {
      const a = env(t, 0.4 + i * 2.4, 99, 0.5);
      if (a <= 0.001) return;
      head(col, a);
      col.lines.forEach((l, k) => {
        const y = 294 + k * 34;
        if (l === null) { line(col.x - 170, y - 8, col.x + 170, y - 8, C.rule, 1, a * 0.5); return; }
        txt(l, col.x - 170, y, { size: 13, color: k > 3 ? C.muted : C.ink, alpha: a * (k > 3 ? 0.85 : 1) });
      });
    });

    // 2 · the control plane, and every capability that lives in it
    const a2 = env(t, 1.6, 99, 0.5);
    if (a2 > 0.001) {
      head({ x: 800, c: C.surface, name: "CONTROL PLANE", sub: "connect  ·  the register",
             foot: "the only thing that mints a contract" }, a2);
      CAPS.forEach((pair, r) => pair.forEach((cap, cc) => {
        const cx = 800 + (cc ? 102 : -102), cy = 292 + r * 46;
        const ca = env(t, 2.0 + (r * 2 + cc) * 0.12, 99, 0.35);
        box(cx, cy, 192, 38, { stroke: C.rule, fill: C.film, alpha: ca });
        txt(cap, cx, cy + 5, { size: 13, align: "center", color: C.ink, alpha: ca });
      }));
      line(630, 490, 970, 490, C.rule, 1, a2 * 0.5);
      txt("HTTP /v1   ·   four roles   ·   dual control", 800, 518,
          { size: 12.5, align: "center", color: C.muted, alpha: a2 * 0.85 });
    }

    // What moves between them. Each arrow is an artifact, not a "call".
    const flow = (x1, x2, y, label, c, a) => {
      if (a <= 0.001) return;
      const back = x2 < x1;
      line(x1, y, x2, y, c, 1, a * 0.7);
      line(x2 + (back ? 9 : -9), y - 5, x2, y, c, 1, a * 0.7);
      line(x2 + (back ? 9 : -9), y + 5, x2, y, c, 1, a * 0.7);
      txt(label, (x1 + x2) / 2, y - 11, { size: 11.5, align: "center", color: C.muted, alpha: a });
    };
    const af = env(t, 4.4, 99, 0.5);
    flow(470, 596, 348, "merge confirmed", C.scope, af);
    flow(596, 470, 470, "receipt", C.scope, af);
    flow(1004, 1131, 330, "contract set", C.surface, af);
    flow(1004, 1131, 412, "revocations", C.refuse, af);
    flow(1131, 1004, 494, "ack", C.surface, af);

    // And what leaves the system entirely.
    const ao = env(t, 5.8, 99, 0.5);
    if (ao > 0.001) {
      box(600, 650, 700, 80, { stroke: C.rule, fill: C.panel, alpha: ao, r: 3 });
      txt("EVIDENCE", 600, 634, { size: 12, align: "center", color: C.muted,
                                  alpha: ao * 0.9, spacing: 2.6 });
      txt("decision trail at the edge   ·   lifecycle chain in the plane", 600, 668,
          { size: 13, align: "center", color: C.ink, alpha: ao });

      box(1290, 650, 560, 80, { stroke: C.policy, fill: C.panel, alpha: ao, r: 3 });
      txt("WARDEN", 1290, 634, { size: 12, align: "center", color: C.policy,
                                 alpha: ao * 0.9, spacing: 2.6 });
      txt("receives the ceiling   ·   decides every call", 1290, 668,
          { size: 13, align: "center", color: C.ink, alpha: ao });
    }

    capTop("Each part of the system has one job.",
            "Git records what was asked for, the control plane decides, the edge enforces.",
            env(t, 0.8, 99, 0.4));
    capStack(0, "Everything that crosses a boundary is signed.",
            "A contract, a revocation and a receipt move between them. No secret is shared.",
            env(t, 4.5, 99, 0.4));
    capStack(1, "Every decision is written down.",
            "The edge records each call. The plane records each change to a contract.", env(t, 7.9, 99, 0.4));
  }

  function s8_close(t) {                // 53.5 → 58
    // Wordmark, what it is, and where it runs. The division of labour with warden was stated
    // twice already — on the two-questions slide and again on the architecture — and a closing
    // frame that re-explains is a closing frame that does not close.
    const a = env(t, 0.15, 9.5, 0.55);
    txt("warden-connect", W / 2, 360, { size: 84, font: SERIF, align: "center", alpha: a,
                                        color: C.ink, weight: "300" });
    line(W / 2 - 236, 398, W / 2 + 236, 398, C.rule, 1, a * 0.7);
    txt("the connection control plane for AI agents", W / 2, 444,
        { size: 21, align: "center", alpha: a * 0.86, color: C.muted, spacing: 3.2 });

    const b = env(t, 0.85, 9.5, 0.5);
    [[-190, C.surface], [0, C.scope], [190, C.policy]]
      .forEach(([dx, c]) => dot(W / 2 + dx, 524, 5, c, b));
    txt("Envoy   ·   Kong   ·   inline mediator", W / 2, 582,
        { size: 15, align: "center", alpha: b * 0.7, color: C.dim, spacing: 2.6 });
  }

  const SCENES = [
    // Every slide holds its finished frame for five seconds before the cut. The film is a
    // walkthrough at this pace, not an elevator pitch — a reader gets to finish the diagram.
    { at: 0,     to: 11.5, fn: s1_reach,         name: "reachable is not approved" },
    { at: 11.5,  to: 22,   fn: s2_estate,        name: "the same defect, N times" },
    { at: 22,    to: 32.5, fn: s3_split,         name: "two questions, two products" },
    { at: 32.5,  to: 46.5, fn: s4_lanes,         name: "I · two lanes that never touch", act: true },
    { at: 46.5,  to: 59.5, fn: s4b_disposition,  name: "I · gated, ungated, refused" },
    { at: 59.5,  to: 70.5, fn: s4c_homes,        name: "I · where the contract lives" },
    { at: 70.5,  to: 83.5, fn: s5_algebra,       name: "II · a ceiling, and whose", act: true },
    { at: 83.5,  to: 96.5, fn: s5b_points,       name: "II · Envoy, Kong, inline mediator" },
    { at: 96.5,  to: 108,  fn: s6_enforce,       name: "II · the refusal at the hop" },
    { at: 108,   to: 119.5, fn: s7_revoke,       name: "revoked, and on the record" },
    { at: 119.5, to: 133.5, fn: s7b_architecture, name: "the whole thing, laid out", act: true },
    { at: 133.5, to: DUR,  fn: s8_close,         name: "warden-connect" },
  ];

  function render(t) {
    t = cl(t, 0, DUR);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(scale, 0, 0, scale, offX, offY);

    ctx.fillStyle = C.film;
    ctx.fillRect(0, 0, W, H);

    const sc = SCENES.find(s => t >= s.at && t < s.to) || SCENES[SCENES.length - 1];
    ctx.save();
    sc.fn(t - sc.at);
    ctx.restore();

    // A quiet frame line, so the canvas reads as a projected image.
    ctx.save();
    ctx.globalAlpha = 0.5; ctx.strokeStyle = C.rule; ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
    ctx.restore();
  }

  // ---- projector ---------------------------------------------------------
  let scale = 1, offX = 0, offY = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    scale = Math.min(cv.width / W, cv.height / H);
    offX = (cv.width - W * scale) / 2;
    offY = (cv.height - H * scale) / 2;
    render(clock);
  }

  let clock = 0, playing = false, last = 0;
  const $play = document.getElementById("play");
  const $track = document.getElementById("track");
  const $fill = document.getElementById("fill");
  const $head = document.getElementById("head");
  const $clockEl = document.getElementById("clock");

  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  function chrome() {
    const p = (clock / DUR) * 100;
    $fill.style.width = p + "%";
    $head.style.left = p + "%";
    $clockEl.textContent = `${mmss(clock)} / ${mmss(DUR)}`;
    $track.setAttribute("aria-valuenow", clock.toFixed(1));
    $play.textContent = clock >= DUR - 0.01 ? "↻" : (playing ? "❚❚" : "▶");
    $play.setAttribute("aria-label", clock >= DUR - 0.01 ? "Replay" : (playing ? "Pause" : "Play"));
  }

  function frame(now) {
    if (playing) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      clock += dt;
      if (clock >= DUR) { clock = DUR; playing = false; }
      render(clock);
      chrome();
    }
    requestAnimationFrame(frame);
  }

  function toggle() {
    if (clock >= DUR - 0.01) clock = 0;
    playing = !playing;
    last = performance.now();
    chrome();
  }
  $play.addEventListener("click", toggle);

  function seekFromEvent(e) {
    const r = $track.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    clock = cl(x / r.width, 0, 1) * DUR;
    render(clock); chrome();
  }
  let dragging = false;
  $track.addEventListener("pointerdown", e => {
    dragging = true; $track.setPointerCapture(e.pointerId); seekFromEvent(e);
  });
  $track.addEventListener("pointermove", e => { if (dragging) seekFromEvent(e); });
  $track.addEventListener("pointerup", e => {
    dragging = false;
    try { $track.releasePointerCapture(e.pointerId); } catch (_) { /* already released */ }
  });
  $track.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { clock = cl(clock + 1, 0, DUR); render(clock); chrome(); e.preventDefault(); }
    if (e.key === "ArrowLeft")  { clock = cl(clock - 1, 0, DUR); render(clock); chrome(); e.preventDefault(); }
  });
  window.addEventListener("keydown", e => {
    if (e.key === " " && e.target === document.body) { toggle(); e.preventDefault(); }
  });

  // Chapter ticks. The two act openings are taller — the film has two halves.
  const $ch = document.getElementById("chapters");
  SCENES.slice(1).forEach(s => {
    const i = document.createElement("i");
    i.style.left = (s.at / DUR) * 100 + "%";
    if (s.act) i.className = "act";
    i.title = s.name;
    $ch.appendChild(i);
  });

  window.addEventListener("resize", resize);

  function begin() {
    resize();
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!still) { playing = true; last = performance.now(); }
    else { clock = 78; render(clock); }   // the algebra, with the product boundary on it
    chrome();
    requestAnimationFrame(frame);
  }

  // Wait for the display face, or the first seconds render in a fallback and then jump.
  if (document.fonts && document.fonts.ready) {
    let started = false;
    const go = () => { if (!started) { started = true; begin(); } };
    document.fonts.ready.then(go);
    setTimeout(go, 1200);
  } else {
    begin();
  }
})();
</script>
