# A standalone network daemon, outside the main workspace on purpose.
#
# It owns its own `main` and is linked into nothing, so §8.2's "no async runtime" — which exists
# to keep `wc-core` embeddable in a caller's own event loop — does not reach it. The crates it
# depends on from the workspace stay sync; the async stops at this binary.
[workspace]

[package]
name = "wc-extproc"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Envoy ext_proc verifier: contract enforcement for internal HTTP/SSE MCP servers"

[dependencies]
warden-connect-gateway = { path = "../../crates/wc-gateway" }
warden-connect-core = { path = "../../crates/wc-core" }
warden-connect-mediator = { path = "../../crates/wc-mediator" }
envoy-types = "0.6"
tonic = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-stream = "0.1"
serde_json = "1"
