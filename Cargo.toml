[workspace]
resolver = "2"
members = ["crates/wc-core", "crates/wc-control", "crates/wc-cli",
    "crates/wc-e2e", "crates/wc-mediator", "crates/wc-gateway", "crates/wc-kong"]
# `daemon/` is deliberately NOT a member. It holds standalone network daemons, which may carry
# an async runtime; the crates above may not (§8.2). Excluding it keeps `cargo tree --workspace`
# — which is what `scripts/dep-count.sh` greps for a banned runtime — answering the question
# that ban is actually about: what gets linked into somebody else's process.
exclude = ["daemon"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "LicenseRef-FSL-1.1-ALv2"
repository = "https://github.com/vijayvedula/warden-connect"

# Shared dependency versions. Member crates opt in with `dep.workspace = true`,
# so the whole workspace can never disagree about a version.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
jsonwebtoken = { version = "10.4.0", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
base64 = "0.22.1"
ureq = "3.3.0"
libc = "0.2.186"
unicode-normalization = "0.1"
# Warden core. Only `wc-mediator` may depend on this: it compiles *into* the
# warden proxy by design (§8.3), so the coupling is the deployment model rather
# than a dependency choice. Every other crate stays independently adoptable —
# the family's interface is two signed artifacts and one identifier (§7.7).
#
# A **version**, not a path. As a path dependency this crate could not resolve from
# crates.io, so `cargo add wc-mediator` was impossible and a consumer had to check out two
# repositories at commits nothing recorded — no version constraint, no semver contract, and
# a binary whose core revision was unanswerable from its own manifest. The coupling model is
# unchanged: still one dependency, still only from `wc-mediator`. What changed is that it is
# now *expressible*.
warden = { package = "warden-agent", version = "0.1" }

# House rules from DRILL.md §2, enforced by the compiler rather than by memory.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
