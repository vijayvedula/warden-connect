[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warden-connect-sdk"
version = "0.1.0"
description = "Client for the warden-connect control-plane API: register parties, request and approve connections, contain a party."
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-FSL-1.1-ALv2"
license-files = ["LICENSE", "LICENSE-APACHE"]
keywords = ["warden", "warden-connect", "mcp", "ai-agents", "authorization", "a2a"]
authors = [{ name = "Warden contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# No runtime dependencies, deliberately. A platform team's first question about a new SDK is
# what it drags into their image, and "nothing" is the answer that gets it approved. The cost
# is about forty lines of urllib plumbing.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/vijayvedula/warden-connect"
Documentation = "https://github.com/vijayvedula/warden-connect/blob/main/docs/conformance.md"

[tool.hatch.build.targets.wheel]
packages = ["warden_connect"]
