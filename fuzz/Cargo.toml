[package]
name = "warden-connect-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
# Package names, not the old `wc-*` ones. The fuzz crate is a SEPARATE workspace, so
# `cargo build` at the root never resolves it and the crate rename left it broken — a nightly
# job nobody watches, red for as long as the rename had existed. The `use wc_core::` in each
# target still works: every crate sets `[lib] name`, which decouples the extern name from the
# package name.
warden-connect-core = { path = "../crates/wc-core" }
warden-connect-control = { path = "../crates/wc-control" }
warden-connect-mediator = { path = "../crates/wc-mediator" }

# Keep the fuzz crate out of the parent's build graph, exactly as `warden/fuzz`
# does. It needs nightly and `libfuzzer-sys`, and neither belongs in the graph a
# `cargo build` of the workspace resolves.
[workspace]

[[bin]]
name = "parse_contract"
path = "fuzz_targets/parse_contract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canon_surface"
path = "fuzz_targets/canon_surface.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_connect_policy"
path = "fuzz_targets/parse_connect_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "screen_text"
path = "fuzz_targets/screen_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "revocation_event"
path = "fuzz_targets/revocation_event.rs"
test = false
doc = false
bench = false
