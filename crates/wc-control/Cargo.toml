[package]
name = "wc-control"
description = "warden-connect control plane: registry, admission, broker, contract issuance, assurance, evidence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published. `warden` is a path dependency by design (§8.3) — it is vendored
# beside this repo rather than fetched — so this crate could not resolve from
# crates.io anyway, and P1 #13 (packaging and a release process) is not built. Marking
# it explicitly also stops an accidental `cargo publish` of an unfinished component,
# and lets `deny.toml` keep `wildcards = "deny"` meaningful for registry crates while
# exempting path dependencies.
publish = false

[dependencies]
# For DSSE envelopes and JOSE segments in `attest`. DSSE uses standard base64
# while JOSE uses base64url, and conflating them silently verifies the wrong
# bytes, so both engines are used explicitly.
base64 = { workspace = true }
wc-core = { path = "../wc-core" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
jsonwebtoken = { workspace = true }
toml = { workspace = true }
# For flock(2): the single-writer election primitive. The only unsafe in the
# crate, wrapped so no caller sees it.
libc = { workspace = true }

[lints]
workspace = true
