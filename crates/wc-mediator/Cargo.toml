[package]
name = "warden-connect-mediator"
description = "The warden-connect data plane: an Upstream decorator that verifies contracts and filters the tool catalogue, over unmodified Warden core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Publishable. `warden` was a path dependency, which meant this crate could not resolve
# from crates.io at all — so `cargo add wc-mediator` was impossible and every consumer had
# to check out two repositories at commits nothing recorded. It is now a **version**
# requirement, patched to the sibling checkout for local development only (see the
# workspace root), so a registry consumer never sees the path.
#
# Publishing is still a decision somebody makes, not a side effect: nothing is tagged, and
# `docs/releasing.md` has the order — Warden core to crates.io first, since this depends on
# a published `warden`.

[[bin]]
name = "connect-mediate"
path = "src/bin/connect-mediate.rs"

# The published name is long and self-describing; the LIBRARY keeps the short one, so every
# `use wc_mediator::…` in this workspace is untouched. rustc takes the extern crate name from the lib
# target rather than the package, which is what makes a registry rename cost nothing in source.
[lib]
name = "wc_mediator"
path = "src/lib.rs"

[dependencies]
# For JWT-SVID verification and XFCC header decoding in `peer`.
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
# `path` for this workspace, `version` for the registry: Cargo prefers the path when
# building here and rewrites it to the version on publish. Without the version,
# crates.io refuses the crate — a wildcard path dependency is not resolvable there.
wc-core = { package = "warden-connect-core", path = "../wc-core", version = "0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
# The one crate in this workspace that links Warden core. Not a dependency
# choice: the mediator composes core's shipped gateway so the data plane adds no
# second hop (LLD §8.6.1). Everything else stays independently adoptable.
warden = { workspace = true }
# For the control-plane pull loop. TLS to the control plane is not optional in
# production, so a hand-rolled client is out of the question.
ureq = { workspace = true }

[lints]
workspace = true
