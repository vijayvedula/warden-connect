[package]
name = "wc-mediator"
description = "The warden-connect data plane: an Upstream decorator that verifies contracts and filters the tool catalogue, over unmodified Warden core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published. `warden` is a path dependency by design (§8.3) — it is vendored
# beside this repo rather than fetched — so this crate could not resolve from
# crates.io anyway, and P1 #13 (packaging and a release process) is not built. Marking
# it explicitly also stops an accidental `cargo publish` of an unfinished component,
# and lets `deny.toml` keep `wildcards = "deny"` meaningful for registry crates while
# exempting path dependencies.
publish = false

[[bin]]
name = "connect-mediate"
path = "src/bin/connect-mediate.rs"

[dependencies]
# For JWT-SVID verification and XFCC header decoding in `peer`.
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
wc-core = { path = "../wc-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# The one crate in this workspace that links Warden core. Not a dependency
# choice: the mediator composes core's shipped gateway so the data plane adds no
# second hop (LLD §8.6.1). Everything else stays independently adoptable.
warden = { workspace = true }
# For the control-plane pull loop. TLS to the control plane is not optional in
# production, so a hand-rolled client is out of the question.
ureq = { workspace = true }

[lints]
workspace = true
