[package]
name = "warden-connect-core"
description = "warden-connect shared types: errors, domain model, canonical surface serialisation, and the connection contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Publishable, and the first of the four: nothing here depends on Warden core or on any
# sibling, so this is the crate that has to reach crates.io before the others can.
#
# Publishing is still a decision somebody makes rather than a side effect — nothing is
# tagged. `docs/releasing.md` has the order.

# The published name is long and self-describing; the LIBRARY keeps the short one, so every
# `use wc_core::…` in this workspace is untouched. rustc takes the extern crate name from the lib
# target rather than the package, which is what makes a registry rename cost nothing in source.
[lib]
name = "wc_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
unicode-normalization = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
