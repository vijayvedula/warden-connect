[package]
name = "warden-connect-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Not for crates.io: path dependencies read as wildcards there, which `cargo deny` refuses.
# wc-e2e carries the same line for the same reason.
publish = false
description = "Phase-shaped contract enforcement for a gateway filter (E5). No transport, no async."

[dependencies]
warden-connect-core = { path = "../wc-core" }
warden-connect-mediator = { path = "../wc-mediator" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
