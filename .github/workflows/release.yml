# Build, attest and publish a release.
#
# `docs/releasing.md` stated the gap plainly: this repository verifies **other people's**
# provenance and produces none of its own, so an operator's trust in a downloaded binary
# rested on the transport — the residual §7.8 A8 describes for a control plane.
#
# This closes it in the format this component already accepts, which is the point. The
# attestation a release carries is a DSSE / in-toto SLSA envelope, and
# `scripts/verify-release.sh` verifies it with `connect attest verify` — no Sigstore client,
# no network, no cosign on the verifying side. A downloader needs a `connect` binary they
# already trust and the public key, and nothing else.
#
# RUN, and it took four dispatches. It was written from the actions' and cosign's
# documentation and every one of the three defects below was invisible until it executed —
# which is what `docs/limitations.md` says about anything not backed by an executed script,
# and the class the four wrong SPIRE commands came from.
#
#   1. `--predicate` was handed a full in-toto Statement; cosign wants only the predicate
#      body and reported `required field buildDefinition missing`.
#   2. `--certificate-identity` omitted the `@<ref>` suffix Fulcio puts in the SAN.
#   3. The step named "with our own verifier" ran only cosign, and extracted a DSSE envelope
#      it never opened. The one thing this file exists to prove was the one thing unproven.
#
# None of the three is a typo; each is a wrong belief about an interface. Green now means both
# halves run on every dispatch: cosign establishes the certificate is Fulcio-issued for this
# workflow, and `scripts/verify-release.sh` then binds the statement to the bytes and to
# `builder.id`. Still verify the artefacts by hand before tagging — `gh run download`, then
# `verify-release.sh` with a `connect` you already trust.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full suite before anything is built. A released binary that fails the gates is worse
  # than no release, because the tag is the thing people will trust.
  gate:
    name: Gates before anything is built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: warden-connect
      - name: Warden core, beside it
        uses: actions/checkout@v4
        with:
          repository: vijayvedula/warden
          path: warden
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests, lints and the conformance kits
        working-directory: warden-connect
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --release -p warden-connect-cli
          ./scripts/conformance.sh
          ./scripts/canon-conformance.sh

  build:
    name: Build and attest
    needs: gate
    runs-on: ubuntu-latest
    env:
      # ONE list. It appeared in four places -- the copy, the digests, and both attestation
      # loops -- so shipping a new artifact meant remembering all four, and the two enforcement
      # points shipped in none of them. A release that omits the binding is a release of a
      # control plane with nothing to enforce it.
      # Artifacts, not just binaries: the Kong binding is a cdylib PLUS the Lua that loads it,
      # and shipping only the .so leaves an operator needing a repo checkout for the half that
      # makes it a plugin.
      ARTIFACTS: connect connect-mediate wc-extproc libwc_kong.so wc-kong-lua.tar.gz
    permissions:
      # Keyless signing: cosign exchanges this for a short-lived Fulcio certificate, so
      # there is no signing key in repository secrets to leak or rotate.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: warden-connect
      - uses: actions/checkout@v4
        with:
          repository: vijayvedula/warden
          path: warden
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: warden-connect
        run: |
          set -euo pipefail
          cargo build --release -p warden-connect-cli -p warden-connect-mediator \
                                -p warden-connect-kong
          # `daemon/` is deliberately outside the workspace (§8.2: the async stops at the
          # binary), so it needs its own manifest rather than a `-p`.
          cargo build --release --manifest-path daemon/wc-extproc/Cargo.toml

      - name: Digests
        id: digests
        working-directory: warden-connect
        run: |
          mkdir -p release
          cp target/release/connect target/release/connect-mediate release/
          cp target/release/libwc_kong.so release/
          cp daemon/wc-extproc/target/release/wc-extproc release/
          # The plugin's Lua half, and the C header the FFI is declared against. Reproducible:
          # sorted, with no owner, group or mtime, so the digest depends on the contents alone.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2020-01-01' \
              -czf release/wc-kong-lua.tar.gz \
              -C crates/wc-kong lua include
          cd release
          # The manifest a human reads and `verify-release.sh` does not: the script computes
          # the digest from the bytes itself, because a digest copied off a release page is a
          # digest whoever controls the page chose.
          sha256sum $ARTIFACTS > SHA256SUMS
          cat SHA256SUMS
          echo "connect=sha256:$(sha256sum connect | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Attest each binary with SLSA provenance
        working-directory: warden-connect/release
        env:
          # The `@<ref>` suffix is load-bearing and was missing. Fulcio issues a GitHub Actions
          # identity as `<workflow-file-url>@<ref>`, so a `--certificate-identity` without it
          # cannot match:
          #
          #     expected SAN value ".../release.yml"
          #     got               ".../release.yml@refs/heads/main"
          #
          # Found by the second dispatch of this workflow, one step after the first failure.
          # The same string is SLSA's convention for `runDetails.builder.id` on GitHub Actions,
          # so one variable now feeds both the predicate and the verification — they cannot
          # drift apart, which was the real defect rather than the missing suffix.
          BUILDER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          for bin in $ARTIFACTS; do
            # ONLY the predicate. Not a full in-toto Statement.
            #
            # The first run of this workflow failed here, and it is the exact gap the header
            # warns about — this step was written from cosign's documentation and never
            # executed. It wrote a complete Statement (`_type`, `subject`, `predicateType`,
            # `predicate`) and got:
            #
            #     Error: provenance predicate: required field buildDefinition missing
            #
            # `cosign attest-blob --type slsaprovenance1 --predicate FILE` reads FILE as the
            # **predicate body** and builds the Statement around it: `subject` from the blob's
            # own name and digest, `predicateType` from `--type`. Handing it a Statement means
            # it looks for `buildDefinition` at the top level and finds `_type` instead.
            #
            # Which is a better arrangement than what was written, because the subject digest
            # is then computed by cosign from the bytes it signed rather than by us from a
            # variable — the binding cannot disagree with the file. The Statement cosign
            # produces is the same shape `DsseProvenanceVerifier` accepts, so our own verifier
            # still checks it in the next step.
            cat > "$bin.predicate.json" <<PREDICATE
          {
            "buildDefinition": {
              "buildType": "https://slsa.dev/github-actions-workflow/v1",
              "externalParameters": {
                "source": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "commit": "${{ github.sha }}"
              }
            },
            "runDetails": {
              "builder": {"id": "$BUILDER"},
              "metadata": {"invocationId": "${{ github.run_id }}"}
            }
          }
          PREDICATE
            cosign attest-blob --yes \
              --predicate "$bin.predicate.json" \
              --type slsaprovenance1 \
              --bundle "$bin.provenance.bundle" \
              --new-bundle-format \
              "$bin"
          done
          ls -la

      # Our own verifier, on our own artefacts, in the same run that produced them. If this
      # step fails the release does not ship — which is the only way the claim in
      # `releasing.md` stays true rather than becoming another line of prose.
      - name: Verify what we just attested, with our own verifier
        working-directory: warden-connect
        env:
          # Must be byte-identical to the value the attest step used. See the note there.
          BUILDER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          # Extracting the DSSE envelope from the Sigstore bundle: `attest verify` takes the
          # envelope, deliberately — it is offline and Sigstore-free by design.
          for bin in $ARTIFACTS; do
            python3 - "release/$bin.provenance.bundle" > "release/$bin.dsse.json" <<'PY'
          import json, sys
          bundle = json.load(open(sys.argv[1]))
          env = bundle.get("dsseEnvelope") or bundle.get("dsse_envelope")
          if env is None:
              sys.exit("no DSSE envelope in the bundle; cosign's bundle shape has changed")
          json.dump(env, sys.stdout)
          PY
            # HALF ONE — cosign: the certificate chains to Fulcio and its SAN is this
            # workflow. Without this, the key extracted below is just a key from a file.
            # `--type slsaprovenance1` is required and was missing. `verify-blob-attestation`
            # defaults to `--type custom`, and cosign v3.1.3 refuses with `invalid predicate
            # type, expected custom got https://slsa.dev/provenance/v1`. This step passed in CI
            # because the cosign installed there did not enforce it — so the workflow was green
            # while the identical command in the release notes failed for a downloader. Being
            # explicit matches `attest-blob --type slsaprovenance1` above and is correct on both.
            cosign verify-blob-attestation \
              --bundle "release/$bin.provenance.bundle" \
              --new-bundle-format \
              --type slsaprovenance1 \
              --certificate-identity "$BUILDER" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "release/$bin"

            # HALF TWO — OUR verifier, which is what this step is named after and what
            # `releasing.md` tells a downloader to rely on.
            #
            # For three runs this step was called "with our own verifier" and ran only cosign.
            # It even extracted the DSSE envelope above and then never opened it — dead
            # evidence, written and unread. The comment claimed "both halves are needed and
            # neither substitutes for the other" while implementing one. A green release
            # therefore proved that cosign can verify cosign's output.
            #
            # The reason it was never wired is real rather than an oversight: `attest verify`
            # wants `--prov-key` as a PEM, and keyless signing puts the key in an X.509
            # certificate. It comes out of the bundle with two commands, which is the bit
            # nobody had worked out — verified by hand against this workflow's own artifacts
            # before being written here.
            python3 - "release/$bin.provenance.bundle" > "release/$bin.cert.der" <<'CERT'
          import base64, json, sys
          bundle = json.load(open(sys.argv[1]))
          material = bundle["verificationMaterial"]
          cert = material.get("certificate")
          if cert is None:
              chain = material.get("x509CertificateChain", {}).get("certificates") or []
              cert = chain[0] if chain else None
          if cert is None:
              sys.exit("no signing certificate in the bundle; cosign's bundle shape changed")
          sys.stdout.buffer.write(base64.b64decode(cert["rawBytes"]))
          CERT
            openssl x509 -inform DER -in "release/$bin.cert.der" \
              -pubkey -noout > "release/$bin.pub.pem"

            # Ordering matters: cosign has already established that this certificate is
            # Fulcio-issued for this workflow, so verifying the DSSE signature against the
            # key inside it is not circular. Our verifier then adds what cosign does not
            # check — that the subject digest equals the file in front of us, and that
            # `builder.id` inside the statement is this workflow and not somebody else's.
            scripts/verify-release.sh \
              "release/$bin" \
              "release/$bin.dsse.json" \
              "release/$bin.pub.pem" \
              "$BUILDER"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: warden-connect/release/

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release/
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail

          # The derived files are NOT attached. `verify-release.sh` needs a public key, and
          # the honest place to get one is the signing certificate inside the bundle — not a
          # `.pem` downloaded from the same page as the binary, which is a key whoever
          # controls the page chose. Publishing one would invite exactly the shortcut this
          # whole verification exists to prevent.
          rm -f release/*.cert.der release/*.pub.pem release/*.predicate.json

          # `--notes-file`, not `--notes`. The notes are a shell string inside a YAML string
          # containing a shell snippet with its own quoting, and the previous version got two
          # things wrong in there that only a reader would catch.
          cat > notes.md <<NOTES
          Verify before you run it. Both steps, in this order.

          **1 · The certificate is Fulcio-issued for this workflow.** Without this, step 2
          checks a signature against a key of unknown provenance.

          \`\`\`sh
          cosign verify-blob-attestation --bundle connect.provenance.bundle --new-bundle-format --type slsaprovenance1 --certificate-identity '$BUILDER' --certificate-oidc-issuer https://token.actions.githubusercontent.com connect
          \`\`\`

          \`--type slsaprovenance1\` is not optional: the default is \`custom\` and cosign refuses
          with \`invalid predicate type\` without it.

          **2 · warden-connect's own verifier binds the statement to these bytes.** No Sigstore
          client, no network. The key comes out of the bundle, because keyless signing puts it
          in the certificate rather than in a published PEM:

          \`\`\`sh
          python3 -c 'import base64,json,sys; b=json.load(open("connect.provenance.bundle")); sys.stdout.buffer.write(base64.b64decode(b["verificationMaterial"]["certificate"]["rawBytes"]))' > connect.cert.der
          openssl x509 -inform DER -in connect.cert.der -pubkey -noout > connect.pub.pem
          scripts/verify-release.sh connect connect.dsse.json connect.pub.pem '$BUILDER'
          \`\`\`

          Use a \`connect\` binary you already trust, or build from source — the thing you are
          verifying may be the first one you have ever downloaded.

          The builder id includes the \`@refs/tags/...\` suffix. That is not decoration: it is
          what Fulcio puts in the certificate SAN and what \`builder.id\` says inside the
          statement, so verification fails without it.

          \`SHA256SUMS\` is for humans. The script computes the digest from the bytes itself,
          because a digest retyped from a page an attacker controls is a digest they chose.

          Every command above was run against these exact files before this release was
          published. Both steps pass; step 1 failed on the first attempt, which is why the
          \`--type\` note is here.
          NOTES

          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            release/*
