# CI. Until this existed, every claim in the repository — the tests, clippy, the
# conformance vectors, the §8.10.3 latency gates — was true on one laptop and nothing
# kept it true. That was P0 #1 in docs/production-readiness.md, and the largest gap in
# the project, because the value of everything else is that it *stays* proven.
#
# Two rules this file is built around, both learned from the code it guards:
#
#   1. A job that could not run its check must fail, not skip. `connect bench` already
#      separates "deliberately not selected" from "could not run for want of a key"
#      for exactly this reason.
#   2. A latency gate means nothing in a debug build, and `cargo test` defaults to one.
#      The release-mode gates are named explicitly rather than assumed to be covered.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # No global `RUSTFLAGS: -D warnings`. It applies to dependencies as well as to us,
  # so a warning introduced by a new compiler version in somebody else's crate would
  # fail this build for a reason nobody here can fix — and it invalidates the cargo
  # cache between steps that set it and steps that do not. `-D warnings` goes on the
  # clippy invocation, where it belongs.

jobs:
  # ---------------------------------------------------------------------------
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: warden-connect }

      # Needed only for the `warden-proxy` feature step below — a default build resolves
      # zero Warden crates. Still checked out here because that step exists to stop the
      # adapter rotting, and a step that cannot run is a step that silently passes.
      - name: Check out Warden core beside it (for the warden-proxy feature only)
        uses: actions/checkout@v4
        with:
          repository: vijayvedula/warden
          path: warden
          token: ${{ secrets.WARDEN_CORE_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: warden-connect }

      # `--all` does not reach fuzz/, which is deliberately outside the workspace, so
      # it gets its own check or it drifts silently.
      - name: cargo fmt
        working-directory: warden-connect
        run: |
          cargo fmt --all --check
          (cd fuzz && cargo fmt --check)

      - name: cargo clippy
        working-directory: warden-connect
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Minted by `cryptography`, not by our Rust, so the attestation test is two
      # readings of SPIFFE/JOSE/DSSE agreeing rather than one implementation talking to
      # itself. Regenerated in CI so a drift between the script and the verifiers is a
      # build failure rather than a stale committed fixture.
      - name: Regenerate the attestation fixtures
        working-directory: warden-connect
        run: |
          python3 -m pip install --quiet 'cryptography>=42'
          rm -rf fixtures/attest
          python3 scripts/gen-attest-fixtures.py

      - name: cargo test
        working-directory: warden-connect
        run: cargo test --workspace

      # The Warden-core decorator topology is behind a feature now, so nothing in the default
      # build exercises the adapter. Without this step it rots silently — which is the whole
      # reason `drain` sat unwired for months.
      - name: the warden-proxy adapter still compiles and passes
        working-directory: warden-connect
        run: |
          cargo clippy -p warden-connect-mediator --all-targets --features warden-proxy -- -D warnings
          cargo test -p warden-connect-mediator --features warden-proxy

      # §8.7.1 stages 1-5 through the real verifiers, to Attested. Named because it is
      # the only thing that proves a party can become attested using the code that
      # ships — `admission`'s own test reaches Attested through stand-ins.
      - name: Attestation, real verifiers (§8.7.1)
        working-directory: warden-connect
        run: cargo test -p wc-e2e --test attest -- --nocapture

      # The e2e test above proves the stage machinery. It does not prove an OPERATOR can get a
      # party to Attested, which is a different claim and the one that was false for months —
      # enforce mode refused every call and the reason took two wrong guesses to find. This
      # drill is the only thing that runs a mediator in enforce mode end to end.
      - name: Attestation drill — a party reaches Attested and enforce mode admits it
        working-directory: warden-connect
        run: |
          python3 -m pip install --quiet 'cryptography>=42'
          ./scripts/attest-drill.sh   # builds the workspace itself

      # The verifier's own tests drive a simulated proxy: real gRPC, real protos, messages this
      # project constructs. That left the parts only Envoy can confirm, and two of them were
      # broken — the response stream was returned after draining the inbound one (deadlocking
      # every real request), and a rewritten body kept the server's content-length (so a
      # filtered catalogue arrived unparseable). Both passed every simulated test.
      - name: Envoy ext_proc drill — enforcement through a real proxy
        working-directory: warden-connect
        run: |
          python3 -m pip install --quiet 'cryptography>=42'
          ./scripts/envoy-drill.sh

      # `daemon/` is outside the workspace, so `cargo test --workspace` does not reach it and a
      # broken daemon would be invisible to every other step in this file. Its own gate lives in
      # dep-count.sh; this is the build and test.
      - name: ext_proc verifier (outside the workspace on purpose)
        working-directory: warden-connect/daemon/wc-extproc
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # The Kong binding runs the SAME wc-gateway decision inside an nginx worker, over a C ABI
      # and a Lua plugin. Three statements of one ABI can disagree — Rust declares it, wc_kong.h
      # describes it, the cdef restates it — and a disagreement is Lua reading a field at the
      # wrong offset, not a crash. The spec compares all three against the built library.
      #
      # luajit is installed rather than assumed: `run.sh` exits 127 when it is missing, which
      # fails this step. A gate that skips when its tooling is absent is a gate that reads as
      # configured and does nothing, which is the defect this whole project is about.
      - name: Kong plugin — the real handler against the real cdylib
        working-directory: warden-connect
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          luajit -v
          ./crates/wc-kong/lua/spec/run.sh

      # And through a real Kong: mTLS the plugin reads an identity out of, a catalogue filtered
      # in the path, and six refusal classes. The library is built for the container, because a
      # glibc or architecture mismatch is a class of failure no test on the build host reaches.
      - name: Kong drill — enforcement inside an nginx worker
        working-directory: warden-connect
        run: ./scripts/kong-drill.sh

      # The drill above is stdio only. "The transport does not change what is enforced" is a
      # claim about a control, and worth nothing until the control has been watched refusing
      # something over that transport — so this runs the same contract, pin and surface ceiling
      # against a REMOTE MCP server over Streamable HTTP, and again with an SSE response body
      # where the result sits behind a progress notification.
      - name: HTTP-mode drill — the same gates over Streamable HTTP and SSE
        working-directory: warden-connect
        run: |
          python3 -m pip install --quiet 'cryptography>=42'
          ./scripts/http-mode-drill.sh   # builds the workspace itself

      # `iss` was carried in every contract, printed by `connect verify`, and never checked.
      # With one plane's keys in a keyring that is harmless; the moment two planes' keys share
      # one — a copied JWKS, a federation import — `aud` is the only boundary left, and `aud` is
      # commonly templated to the same string in every plane. Phase 5 is that estate. The other
      # phases take a contract through an external signer and back, which nothing had done end
      # to end even though `--signer` had shipped.
      - name: Custody drill — an external issuer key, and two planes that stay separate
        working-directory: warden-connect
        run: ./scripts/custody-drill.sh   # builds the workspace itself

      # `Term.deprecates` had no reader and `Matched.offer_version` was dropped at mint time —
      # the second with a doc comment claiming it existed "so a later upgrade can find what it
      # affects". So a provider could publish a withdrawal schedule that bound nothing, and could
      # not be told who a removal would break. This drill runs the whole change of terms.
      - name: Upgrade drill — a provider changes their terms and everyone finds out in time
        working-directory: warden-connect
        run: ./scripts/upgrade-drill.sh   # builds the workspace itself

      # `into_offer` refuses what cannot work. `offer lint` catches what mints and is still wrong —
      # a withdrawal date closer than the ceiling beside it refuses every consumer at that ceiling,
      # and the message THEY see says "lower your ttl", which never reaches the provider whose two
      # numbers disagree. Covered by unit tests; scripts/ci/offer-lint.yml is the provider-side job.

      # GitHub Actions publishes an RSA-only OIDC JWKS, and `IssuerKeys::add_jwks` skipped every
      # RSA key — so `--oidc-token` against the issuer most estates would use could resolve no key
      # at all. A documented flag that could not work. This drill proves the shape end to end, and
      # states plainly that OIDC satisfies the identity stage and does NOT reach Attested.
      - name: OIDC drill — a workload identity from a token the estate already has
        working-directory: warden-connect
        run: ./scripts/oidc-drill.sh

      # The catalogue drill now also covers the read-only portal: that it serves behind the read
      # role, refuses an unauthenticated request, ships `default-src 'none'`, and contains no form,
      # button or POST. That last one is a design claim, and a claim nobody asserts is a claim that
      # quietly stops being true.

      # `merge_evidence` decides who authored a merge and who approved it, and both the
      # separation-of-duties check and the keyless approval path rest on those two fields. Three
      # wrappers parsed that JSON with `sed`; Azure's greedy match could swap author and approver
      # outright, which makes a self-approval read as reviewed. This runs each host's real jq
      # program against fixtures shaped to defeat greedy matching.
      - name: SCM parse drill — merge_evidence is read from the right fields
        working-directory: warden-connect
        run: ./scripts/scm/parse-drill.sh

      # `named_consumer` — the approval mode a provider can actually write on day one, before any
      # consumer exists — returned `NeedsNamedApproval`, and `match_need` pushed it onto the
      # **refusal** list with the words "not wired yet". So the provider's most guarded terms were
      # the only ones that could not be used, and the most permissive were the only ones that
      # worked. This drill runs browse -> ask -> the provider decides.
      - name: Catalogue drill — a consumer browses, asks, and the provider approves
        working-directory: warden-connect
        run: ./scripts/catalogue-drill.sh   # builds the workspace itself

      # Contract-set acks lived in a `HashMap::new()` that was never loaded or saved, so a
      # restart zeroed them and any deploy gate built on them would block every deploy. This
      # drill kills and restarts the control plane in the middle to assert exactly that.
      - name: Distribution drill — the deploy gate, and acks that survive a restart
        working-directory: warden-connect
        run: ./scripts/distribution-drill.sh   # builds the workspace itself

      # Named separately from the run above even though it is inside it: the §8.15.3
      # conformance vectors are the ground truth a third party implements against, and
      # a green summary line is not the same as knowing they ran.
      # The kit as a third party would use it: the harness against a verifier, rather than
      # our own unit test reading the same fixtures it wrote. A harness bug is invisible to
      # the unit test and fatal to an implementer — two were found this way (P2 #16).
      - name: Conformance kit, through the harness
        working-directory: warden-connect
        run: |
          cargo build -p warden-connect-cli
          ./scripts/conformance.sh

      - name: Conformance vectors (§8.15.3)
        working-directory: warden-connect
        run: cargo test -p warden-connect-core --lib conformance -- --nocapture

      # The `wcs1` vector set, through its harness, for the same reason the contract kit
      # runs through its own: `every_published_vector_still_holds` checks the digests, and
      # only the harness checks that a third party can actually drive them. A published
      # vector set with a broken harness is a vector set nobody outside this repo can use.
      - name: wcs1 canonicalisation vectors, through the harness
        working-directory: warden-connect
        run: ./scripts/canon-conformance.sh

      # §8.16's P2 exit criterion is a number: screening precision >= 0.98 on the
      # labelled corpus. Named here, with output, because a criterion buried in a
      # green summary line is a criterion nobody reads. Recall is gated too — a false
      # positive is loud, a false negative ships.
      - name: Screening calibration (§8.16 P2 exit criterion)
        working-directory: warden-connect
        run: cargo test -p warden-connect-control --lib calibration -- --nocapture

      # The SDK's only verification used to be "the examples run against a live control
      # plane" — an integration test needing an estate, keys and an approver registry, so
      # it never ran here and the client's logic went unchecked. These need no server:
      # they pin what a status means, that a retry reuses its idempotency key, and that a
      # refusal keeps its WC-* code. No dependencies beyond pytest, because the SDK
      # deliberately has none.
      - name: SDK tests
        working-directory: warden-connect/sdk/python
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: warden-connect }
      - uses: actions/checkout@v4
        with:
          repository: vijayvedula/warden
          path: warden
          token: ${{ secrets.WARDEN_CORE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: warden-connect, key: msrv }
      # Build and test, not just build: `rust-version` is a promise about what
      # compiles, and a promise nobody exercises is a guess.
      - name: cargo test on the pinned MSRV
        working-directory: warden-connect
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  gates:
    name: latency gates (§8.10.3) + §8.16 acceptance criteria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: warden-connect }
      - uses: actions/checkout@v4
        with:
          repository: vijayvedula/warden
          path: warden
          token: ${{ secrets.WARDEN_CORE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: warden-connect, key: gates }

      # Release, because a latency ceiling in a debug build measures the debug build.
      # `gate_filter` asserts a 12x tripwire in debug and says loudly that it is not
      # the real gate, so this line is the only place the real one is checked.
      - name: filter_tools_list, 256 tools
        working-directory: warden-connect
        run: cargo test -p warden-connect-mediator --release --test mediation gate_filter -- --nocapture

      # Every gate, and a non-zero exit on regression or on a gate that could not run.
      # The thresholds are the design's, not the runner's — a slow runner reports an
      # honest failure rather than recalibrating, which is the whole point of them.
      #
      # This now includes two §8.16 *acceptance criteria* that were stated as phase exit
      # gates and never measured (P1 #9): `export::dora` at 10⁵ contracts, and
      # `registry::register` at 10⁴ entities. The second is the slowest thing in CI at
      # ~40 s, and that cost is the point — the criterion is not met by registering a
      # hundred entities quickly.
      - name: connect bench
        working-directory: warden-connect
        run: |
          cargo build --release -p warden-connect-cli
          ./target/release/connect bench \
            --iterations 400 \
            --scale 100000 \
            --signing-key fixtures/keys/test_issuer_es256_priv.pem \
            --verify-pub  fixtures/keys/test_issuer_es256_pub.pem \
            --kid wc-test-es256

      # §8.16 P3: "quarterly containment drill script in the repo". Running it in CI does
      # not replace the quarterly run against a real hardware token — the script says so
      # itself — but it does keep the script working, which is the failure mode of every
      # drill script that exists and is never executed.
      - name: containment drill
        working-directory: warden-connect
        run: ./scripts/containment-drill.sh

      # §8.16 P4: federation against a *second* control plane, with its own issuer key.
      # This had only ever been tested against itself.
      - name: cross-organisation federation
        working-directory: warden-connect
        run: cargo test -p wc-e2e --test federation

  # ---------------------------------------------------------------------------
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: warden-connect }
      - uses: actions/checkout@v4
        with:
          repository: vijayvedula/warden
          path: warden
          token: ${{ secrets.WARDEN_CORE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # §8.3's thin-dependency argument is central to how this component is sold, and
      # nothing verified it until deny.toml existed. The bans list encodes the four
      # categories the design rules out by name, so "no async runtime" is enforced
      # rather than remembered.
      - name: cargo deny check
        working-directory: warden-connect
        run: cargo deny check

      # A count, because cargo-deny cannot express one and the LLD quotes numbers.
      # They were 30 and 61 in the document and 80 and 110 in reality — a claim that
      # drifts silently is worse than no claim.
      - name: Dependency-count ceilings (§8.3)
        working-directory: warden-connect
        run: ./scripts/dep-count.sh

      # A spawn outside the gate can hold open a pipe belonging to a call that used it, and the
      # call reports the shim as never answering. The lock is four lines; adoption is what rots.
      - name: Every spawn goes through the gate
        working-directory: warden-connect
        run: ./scripts/spawn-adoption.sh

      # This repository ships a CycloneDX BOM *generator* (`export::cyclonedx_bom`, for a
      # tool surface) and shipped no BOM of itself. A component that asks an estate to
      # inventory its agents while being uninventoriable is asking for a trust it does not
      # extend. The check fails on a component with no licence and on a local path leaking
      # into the document.
      # The alert rules, unit-tested. `check` proves the file parses; `test` proves each
      # alert fires and — as importantly — stays quiet on an idle estate. Writing these
      # found two rules referencing series that did not exist on a healthy control plane.
      #
      # `alert-coverage.sh` runs FIRST and without promtool, because it is the step that
      # notices what promtool cannot: a rule nobody asserted. promtool checks the tests it is
      # given and never asks what was left out, so three rules sat uncovered through every
      # green run of this job — and one of them could not fire at all.
      - name: alert rules
        working-directory: warden-connect
        run: |
          ./scripts/alert-coverage.sh
          if command -v promtool >/dev/null 2>&1; then
            promtool check rules deploy/prometheus/alerts.yml
            promtool test rules  deploy/prometheus/alerts_test.yml
          else
            echo "promtool absent; skipping (see scripts/preflight.sh)"
          fi

      - name: SBOM of ourselves
        working-directory: warden-connect
        run: |
          python3 scripts/sbom.py --check
          python3 scripts/sbom.py > warden-connect.cdx.json
          # Reproducible by construction — no timestamp, no filesystem paths — so a diff is
          # how anyone notices a dependency appeared.
          python3 scripts/sbom.py | diff -q - warden-connect.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: warden-connect/warden-connect.cdx.json

  # ---------------------------------------------------------------------------
  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      # The build context is the *parent* of both checkouts: Warden core is a path
      # dependency (§8.3), so an image built without it is an image whose mediator cannot
      # exist. This layout is the Dockerfile's documented contract, and this job is what
      # keeps it true — the file cannot be built on a machine with no container runtime,
      # so CI is the only place it is verified.
      - uses: actions/checkout@v4
        with: { path: warden-connect }
      - uses: actions/checkout@v4
        with:
          repository: vijayvedula/warden
          path: warden
          token: ${{ secrets.WARDEN_CORE_TOKEN || github.token }}

      - name: docker build
        run: docker build -f warden-connect/Dockerfile -t warden-connect:ci .

      # An image that builds and cannot run is not a release artifact. Both binaries are
      # exercised, because they are the two halves of the product and only one of them is
      # the entrypoint.
      - name: the image actually runs
        run: |
          docker run --rm warden-connect:ci version
          docker run --rm --entrypoint connect-mediate warden-connect:ci --help | head -3

      # The state root has to be writable by the non-root user, or `serve` fails on its first
      # append — which would otherwise only be discovered by whoever deployed it.
      #
      # `register agent --card`, not `register server --endpoint`. The first version of this
      # step used the latter and failed, correctly: registering a *server* runs admission
      # stage 2, which fetches the callee's surface over the network, and `x.internal`
      # resolves nowhere in a container. It exited 1 with `WC-1002 surface unobtainable`, so
      # the step was testing DNS rather than the filesystem.
      #
      # A card is a file, so this path is entirely offline — and it proves more than the
      # original intended: an append to the state log *and* to the evidence chain, both
      # fsynced, as uid 10001.
      - name: the state root is writable by the unprivileged user
        run: |
          docker run --rm \
            -v "$PWD/warden-connect/fixtures/attest/agent-card.signed.json:/card.json:ro" \
            warden-connect:ci register agent --card /card.json \
            --owner human:ci --zone internal.ci --by human:ci

  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: warden-connect }
      - uses: actions/checkout@v4
        with:
          repository: vijayvedula/warden
          path: warden
          token: ${{ secrets.WARDEN_CORE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: warden-connect/fuzz, key: fuzz }
      # Compile only. A coverage-guided campaign belongs on a schedule, not on every
      # push — but a target that has quietly stopped compiling is a fuzz directory
      # that reads as coverage while providing none, which is the failure the stable
      # mirror in wc-e2e/tests/fuzz.rs also exists to prevent.
      - name: cargo check the fuzz targets
        working-directory: warden-connect/fuzz
        run: cargo check --all-targets
