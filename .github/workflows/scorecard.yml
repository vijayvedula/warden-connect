name: Scorecard

# OpenSSF Scorecard — automated security-posture checks (branch protection,
# token permissions, pinned actions, dependency update tooling, SAST, etc.).
# Publishes results to the OpenSSF and powers the README Scorecard badge.
# Activates once the repository is public; runs weekly and on demand.

on:
  # A run on the default branch is what the OpenSSF ingests; without it the
  # published result only refreshes on the weekly cron or a protection change,
  # and the badge reads "invalid repo path" until one of those happens.
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish results to the OpenSSF (OIDC)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          sarif_file: results.sarif
