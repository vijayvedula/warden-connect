name: 🐛 Bug report
description: Something in warden-connect isn't working as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. For **security vulnerabilities**,
        do **not** use this form — see [SECURITY.md](https://github.com/vijayvedula/warden-connect/blob/main/.github/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: A call outside the contract's surface was forwarded instead of refused…
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Error code, if there was one
      description: The `WC-*` code, and whether it matched what you expected.
      placeholder: WC-3108
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, the offer and need manifests, the policy, and the contract if possible. Minimal repros get fixed fastest.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Control plane (registry, admission, issuance, policy)
        - Contract artifact, canonicalisation or verification
        - Inline mediator (connect-mediate)
        - Envoy binding (wc-extproc)
        - Kong binding (libwc_kong.so, Lua plugin)
        - Source-host shim (GitHub, GitLab, Azure Repos, Bitbucket)
        - Evidence, chain or export
        - CLI (connect)
        - Docs
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: enforcement-mode
    attributes:
      label: Mode
      options:
        - enforce
        - observe
        - not applicable
  - type: textarea
    id: version
    attributes:
      label: Version and platform
      description: Output of `connect version`, plus OS and architecture. For a gateway binding, the proxy version too.
      render: shell
    validations:
      required: true
  - type: textarea
    id: trail
    attributes:
      label: Decision trail or logs
      description: Relevant rows from the decision trail, or the daemon's output. Redact identifiers you do not want public.
      render: shell
